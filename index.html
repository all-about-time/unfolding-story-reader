<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="The Unfolding Story: a progressive Bible reading journey through 266 sessions.">
  <title>The Unfolding Story</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="./">The Unfolding Story</a><span class="translation">Berean Standard Bible</span></header>
  <main class="shell">
    <section class="reader-header">
      <p class="eyebrow" id="part">Loading reading plan…</p><h1 id="title">Scripture Reader</h1><p class="session-meta" id="session-meta"></p>
      <nav class="session-nav" aria-label="Session navigation"><a id="previous" class="nav-button" href="#">Previous</a><label>Session <select id="session-select" aria-label="Choose a reading session"></select></label><a id="next" class="nav-button" href="#">Next</a></nav>
    </section>
    <div class="reading-controls"><span>Progressive reading · no daily schedule</span><div><button id="smaller" type="button" aria-label="Decrease text size">A−</button><button id="larger" type="button" aria-label="Increase text size">A+</button></div></div>
    <article id="readings" class="reader" aria-live="polite"></article>
    <details id="supplementary" class="supplementary"><summary>Supplementary reading <span>optional</span></summary><div id="extra" class="reader"></div></details>
    <p id="error" class="error" role="alert" hidden></p>
  </main>
  <footer>Scripture quotations are from the Berean Standard Bible (BSB), public domain. The reading sequence is independently curated.</footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
